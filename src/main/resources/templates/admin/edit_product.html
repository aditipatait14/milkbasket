<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<body>
	<section>
		<div class="container py-4">
			<div class="row justify-content-center">
				<div class="col-xl-9">
					<div class="surface-panel p-4">
						<h2 class="mb-3">Edit Product</h2>

						<th:block th:if="${session.succMsg}">
							<p class="alert alert-success text-center">[[${session.succMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>
						<th:block th:if="${session.errorMsg}">
							<p class="alert alert-danger text-center">[[${session.errorMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<form action="/admin/updateProduct" method="post" enctype="multipart/form-data">
							<input type="hidden" name="id" th:value="${product.id}">
							<div class="row g-4 align-items-start">
								<div class="col-lg-4">
									<img th:src="${@fileStorageService.resolveProductImage(product.image)}"
										class="product-thumb" style="height: 320px;" alt="Product image">
								</div>
								<div class="col-lg-8">
									<div class="row g-3">
										<div class="col-12">
											<label class="form-label">Title</label>
											<input type="text" name="title" th:value="${product.title}" class="form-control">
										</div>
										<div class="col-12">
											<label class="form-label">Description</label>
											<textarea rows="4" class="form-control" name="description">[[${product.description}]]</textarea>
										</div>
										<div class="col-md-6">
											<label class="form-label">Category</label>
											<select class="form-select" name="category">
												<option th:value="${product.category}">[[${product.category}]]</option>
												<option th:each="c:${categories}" th:value="${c.name}">[[${c.name}]]</option>
											</select>
										</div>
										<div class="col-md-6">
											<label class="form-label">Price</label>
											<input type="number" step="0.01" name="price" th:value="${@commnServiceImpl.formatPrice(product.price)}" class="form-control">
										</div>
										<div class="col-md-6">
											<label class="form-label">Cost Price</label>
											<input type="number" step="0.01" min="0" name="costPrice" th:value="${@commnServiceImpl.formatPrice(product.costPrice)}" class="form-control">
										</div>
										<div class="col-md-4">
											<label class="form-label">Discount %</label>
											<input type="number" min="0" max="100" name="discount" th:value="${product.discount}" class="form-control">
										</div>
										<div class="col-md-4">
											<label class="form-label">Discount Price</label>
											<input type="text" readonly th:value="${@commnServiceImpl.formatPrice(product.discountPrice)}" class="form-control">
										</div>
										<div class="col-md-4">
											<label class="form-label">Stock</label>
											<input type="number" name="stock" th:value="${product.stock}" class="form-control">
										</div>
										<div class="col-md-6">
											<label class="form-label d-block">Status</label>
											<div class="form-check">
												<input class="form-check-input" type="radio" th:checked="${product.isActive==true}" value="true" name="isActive" id="editProductActive">
												<label class="form-check-label" for="editProductActive">Active</label>
											</div>
											<div class="form-check">
												<input class="form-check-input" type="radio" name="isActive" th:checked="${product.isActive==false}" value="false" id="editProductInactive">
												<label class="form-check-label" for="editProductInactive">Inactive</label>
											</div>
										</div>
										<div class="col-md-6">
											<label class="form-label">Replace Image</label>
											<input type="file" name="file" class="form-control">
										</div>
									</div>
								</div>
							</div>
							<button class="btn btn-primary w-100 mt-4">Update Product</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
