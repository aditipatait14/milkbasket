<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<body>
	<section>
		<div class="container py-4">
			<div class="row justify-content-center">
				<div class="col-xl-6">
					<div class="surface-panel p-4">
						<h2 class="mb-3">Edit Category</h2>
						<th:block th:if="${session.succMsg}">
							<p class="alert alert-success text-center">[[${session.succMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>
						<th:block th:if="${session.errorMsg}">
							<p class="alert alert-danger text-center">[[${session.errorMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<form action="/admin/updateCategory" method="post" enctype="multipart/form-data">
							<input type="hidden" name="id" th:value="${category.id}">
							<div class="text-center mb-4">
								<img th:src="${@fileStorageService.resolveCategoryImage(category.imageName)}"
									width="120" height="120" style="border-radius: 24px; object-fit: cover;" alt="Category">
							</div>
							<div class="mb-3">
								<label class="form-label">Category Name</label>
								<input type="text" name="name" th:value="${category.name}" class="form-control">
							</div>
							<div class="mb-3">
								<label class="form-label d-block">Status</label>
								<div class="form-check">
									<input class="form-check-input" type="radio" th:checked="${category.isActive==true}" value="true" name="isActive" id="editCatActive">
									<label class="form-check-label" for="editCatActive">Active</label>
								</div>
								<div class="form-check">
									<input class="form-check-input" type="radio" name="isActive" th:checked="${category.isActive==false}" value="false" id="editCatInactive">
									<label class="form-check-label" for="editCatInactive">Inactive</label>
								</div>
							</div>
							<div class="mb-3">
								<label class="form-label">Replace Image</label>
								<input type="file" name="file" class="form-control">
							</div>
							<button class="btn btn-primary w-100">Update Category</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
