<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<body>
	<section>
		<div class="container py-4">
			<div class="row g-4">
				<div class="col-lg-4">
					<div class="surface-panel p-4">
						<h3 class="mb-3">Add Category</h3>
						<th:block th:if="${session.succMsg}">
							<p class="alert alert-success text-center">[[${session.succMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>
						<th:block th:if="${session.errorMsg}">
							<p class="alert alert-danger text-center">[[${session.errorMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<form action="/admin/saveCategory" method="post" enctype="multipart/form-data">
							<div class="mb-3">
								<label class="form-label">Category Name</label>
								<input type="text" name="name" class="form-control" required>
							</div>
							<div class="mb-3">
								<label class="form-label d-block">Status</label>
								<div class="form-check">
									<input class="form-check-input" type="radio" checked value="true" name="isActive" id="catActive">
									<label class="form-check-label" for="catActive">Active</label>
								</div>
								<div class="form-check">
									<input class="form-check-input" type="radio" name="isActive" value="false" id="catInactive">
									<label class="form-check-label" for="catInactive">Inactive</label>
								</div>
							</div>
							<div class="mb-3">
								<label class="form-label">Category Image</label>
								<input type="file" name="file" class="form-control">
							</div>
							<button class="btn btn-primary w-100">Save Category</button>
						</form>
					</div>
				</div>

				<div class="col-lg-8">
					<div class="surface-panel p-4">
						<div class="section-head">
							<div>
								<h3 class="mb-1">Category Details</h3>
								<p>Total categories: [[${totalElements}]]</p>
							</div>
						</div>

						<div class="table-responsive">
							<table class="table align-middle">
								<thead>
									<tr>
										<th>Sl No</th>
										<th>Category</th>
										<th>Status</th>
										<th>Image</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="cat,c:${categorys}">
										<td>[[${c.count}]]</td>
										<td>[[${cat.name}]]</td>
										<td><span class="badge-soft" th:text="${cat.isActive ? 'Active' : 'Inactive'}"></span></td>
										<td><img th:src="${@fileStorageService.resolveCategoryImage(cat.imageName)}"
											width="56" height="56" style="border-radius: 16px; object-fit: cover;" alt="Category"></td>
										<td>
											<a th:href="@{'/admin/loadEditCategory/'+${cat.id}}" class="btn btn-primary btn-sm">Edit</a>
											<a th:href="@{'/admin/deleteCategory/'+${cat.id}}" class="btn btn-danger btn-sm">Delete</a>
										</td>
									</tr>
								</tbody>
							</table>
						</div>

						<nav>
							<ul class="pagination mb-0">
								<li class="page-item" th:classappend="${isFirst} ? 'disabled':''">
									<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo-1}}">&laquo;</a>
								</li>
								<li class="page-item" th:each="i:${#numbers.sequence(1,totalPages)}"
									th:classappend="${pageNo+1==i}?'active':''">
									<a class="page-link" th:href="@{'/admin/category?pageNo='+${i-1}}">[[${i}]]</a>
								</li>
								<li class="page-item" th:classappend="${isLast} ? 'disabled':''">
									<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo+1}}">&raquo;</a>
								</li>
							</ul>
						</nav>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
