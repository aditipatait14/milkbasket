<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<body>
	<section>
		<div class="container py-4">
			<div class="row g-4 align-items-stretch">
				<div class="col-lg-5">
					<div class="auth-visual h-100">
						<span class="eyebrow bg-white text-dark"><i class="fa-solid fa-key"></i> Account recovery</span>
						<h2 class="mt-3 mb-3">Reset your password safely.</h2>
						<p>Enter your email address and we’ll send a secure password reset link if your account exists.</p>
						<img src="/img/forgotPass.png" alt="Forgot password">
					</div>
				</div>
				<div class="col-lg-7">
					<div class="auth-card h-100">
						<h2 class="mb-3">Forgot Password</h2>

						<th:block th:if="${session.succMsg}">
							<p class="alert alert-success text-center">[[${session.succMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<th:block th:if="${session.errorMsg}">
							<p class="alert alert-danger text-center">[[${session.errorMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<form action="/forgot-password" method="post">
							<div class="mb-3">
								<label class="form-label">Email Address</label>
								<input required class="form-control" name="email" type="email"
									placeholder="Enter your registered email">
							</div>
							<button type="submit" class="btn btn-primary px-4 py-3">Send Reset Link</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
