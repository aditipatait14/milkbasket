<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<body>
	<section>
		<div class="container py-4">
			<div class="row g-4 align-items-stretch">
				<div class="col-lg-5">
					<div class="auth-visual h-100">
						<span class="eyebrow bg-white text-dark"><i class="fa-solid fa-lock"></i> Password reset</span>
						<h2 class="mt-3 mb-3">Set your new password.</h2>
						<p>Choose a strong password to secure your MilkBasket account.</p>
						<img src="/img/forgotPass.png" alt="Reset password">
					</div>
				</div>
				<div class="col-lg-7">
					<div class="auth-card h-100">
						<h2 class="mb-3">Reset Password</h2>
						<th:block th:if="${session.succMsg}">
							<p class="alert alert-success text-center">[[${session.succMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>
						<th:block th:if="${session.errorMsg}">
							<p class="alert alert-danger text-center">[[${session.errorMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<form action="/reset-password" method="post" id="resetPassword" novalidate>
							<div class="mb-3">
								<label class="form-label">New Password</label>
								<input id="pass" class="form-control" name="password" type="password" required>
							</div>
							<div class="mb-3">
								<label class="form-label">Confirm Password</label>
								<input name="confirmPassword" class="form-control" type="password" required>
							</div>
							<input type="hidden" th:value="${token}" name="token">
							<button type="submit" class="btn btn-primary w-100 py-3">Reset Password</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
