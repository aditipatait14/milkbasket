<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<body>
	<section>
		<div class="container py-4">
			<div class="row g-4 align-items-stretch">
				<div class="col-lg-5">
					<div class="auth-visual h-100">
						<span class="eyebrow bg-white text-dark"><i class="fa-solid fa-user-plus"></i> New customer onboarding</span>
						<h2 class="mt-3 mb-3">Create your MilkBasket account.</h2>
						<p>Register once to save your address, track orders and shop your dairy essentials faster every time.</p>
						<img src="/img/MB-1.jpg" alt="Register visual">
					</div>
				</div>
				<div class="col-lg-7">
					<div class="auth-card h-100">
						<h2 class="mb-3">Create Account</h2>

						<th:block th:if="${session.succMsg}">
							<p class="alert alert-success text-center">[[${session.succMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<th:block th:if="${session.errorMsg}">
							<p class="alert alert-danger text-center">[[${session.errorMsg}]]</p>
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</th:block>

						<form action="/saveUser" enctype="multipart/form-data" id="userRegister" novalidate method="post">
							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label">Full Name</label>
									<input required class="form-control" name="name" type="text">
								</div>
								<div class="col-md-6">
									<label class="form-label">Mobile Number</label>
									<input required class="form-control" name="mobileNumber" type="text">
								</div>
								<div class="col-12">
									<label class="form-label">Email</label>
									<input required class="form-control" name="email" type="email">
								</div>
								<div class="col-md-6">
									<label class="form-label">Address</label>
									<input required class="form-control" name="address" type="text">
								</div>
								<div class="col-md-6">
									<label class="form-label">City</label>
									<input required class="form-control" name="city" type="text">
								</div>
								<div class="col-md-6">
									<label class="form-label">State</label>
									<input required class="form-control" name="state" type="text">
								</div>
								<div class="col-md-6">
									<label class="form-label">Pincode</label>
									<input required class="form-control" name="pincode" type="text">
								</div>
								<div class="col-md-6">
									<label class="form-label">Password</label>
									<input required class="form-control" name="password" type="password" id="pass">
								</div>
								<div class="col-md-6">
									<label class="form-label">Confirm Password</label>
									<input required class="form-control" name="confirmpassword" type="password">
								</div>
								<div class="col-12">
									<label class="form-label">Profile Image</label>
									<input class="form-control" name="img" type="file">
								</div>
							</div>

							<button type="submit" class="btn btn-primary w-100 py-3 mt-4">Create Account</button>
						</form>

						<div class="text-center mt-4">
							Already registered? <a href="/signin">Sign in here</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
