spring.datasource.url=jdbc:mysql://localhost:3306/milkbasket_new?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${name}
spring.datasource.password=${password}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

#Spring mail
spring.mail.host=smtp.gmail.com
spring.mail.username=yourgmail@gmail.com
spring.mail.password=${password}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

rupee.sign=${RUPEE_SIGN:&#8377;}

checkout.default-delivery-fee=${CHECKOUT_DELIVERY_FEE:50}
checkout.default-tax-rate=${CHECKOUT_TAX_RATE:5}

#Razorpay 
payment.razorpay.enabled=true
payment.razorpay.key-id=${rayzorpayId}
payment.razorpay.key-secret=${rayzorpaySecret}
payment.razorpay.currency=INR

app.upload.dir=${APP_UPLOAD_DIR:${user.dir}/uploads}
